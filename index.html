<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <link rel="stylesheet"
        href="https://js.arcgis.com/4.31/esri/themes/light/main.css">

  <script src="https://js.arcgis.com/4.31/"></script>

  <style>
    html, body, #viewDiv {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="viewDiv"></div>

<script>

require([
  "esri/Map",
  "esri/views/MapView"
], function(Map, MapView){

  const map = new Map({
    basemap: "streets-vector"
  });

  const view = new MapView({
    container: "viewDiv",
    map: map,
    center: [3.6139, 51.4988],
    zoom: 13
  });

});

</script>

</body>
</html>
